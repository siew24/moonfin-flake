name: Update Moonfin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-moonfin:
    name: Update Moonfin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: 'main'
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "Github Actions"

      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/update.sh --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        # TODO: they're @ v31 so next time let's try DeterminateSystems/nix-installer-action@main
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Nix Magic Cache
        if: steps.check.outputs.should_update == 'true'
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Install script dependencies
        if: steps.check.outputs.should_update == 'true'
        run: |
          mkdir -p $HOME/.local/bin
          wget -O $HOME/.local/bin/yj https://github.com/sclevine/yj/releases/download/v5.1.0/yj-linux-amd64
          chmod +x $HOME/.local/bin/yj
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update versions
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAX_RETRIES=3

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "::group::Attempt $attempt/$MAX_RETRIES"

            if .github/update.sh --ci; then
              echo "::endgroup::"
              echo "::notice::Update successful on attempt $attempt"
              exit 0
            fi

            EXIT_CODE=$?
            echo "::endgroup::"

            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "::warning::Attempt $attempt failed. Cleaning up and retrying..."
              git checkout HEAD -- . && git clean -fd
              sleep $((attempt * 5))
            else
              echo "::error::All $MAX_RETRIES attempts failed"
              exit $EXIT_CODE
            fi
          done

      # Flakes only see files git tracks, so a freshly generated git-hashes.json
      # is invisible to `nix build` until it is staged.
      - name: Stage changes
        if: steps.check.outputs.should_update == 'true'
        run: git add -A

      # This gates the push. It used to be a separate `test-build` job keyed on
      # `needs.update-moonfin.outputs.success`, which read
      # `steps.update.outputs.should_update` -- an output update.sh only ever
      # writes on the --only-check path, never on the --ci run that step makes.
      # The condition was therefore always false and the job never ran once, so
      # a broken update reached main unchecked. That is how 2.5.1 shipped
      # unbuildable.
      - name: Build packages
        if: steps.check.outputs.should_update == 'true'
        run: |
          for package in $(nix flake show --json 2>/dev/null | jq -r '.packages.["x86_64-linux"] | keys | .[]'); do
              nix build --system 'x86_64-linux' ".#$package"
          done

      - name: Commit changes
        id: commit
        if: steps.check.outputs.should_update == 'true'
        env:
          COMMIT_MESSAGE: "${{ steps.update.outputs.commit_message }}"
        run: |
          git commit -m "$COMMIT_MESSAGE"
          git push
